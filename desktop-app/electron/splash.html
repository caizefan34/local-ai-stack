    <script>
      /* Electron desktop bridge — guarded so the page also renders in a plain browser. */
      (function () {
        var win = typeof window !== 'undefined' ? window : null;
        var desktop = win && typeof win.desktop === 'object' ? win.desktop : null;

        var minBtn = document.querySelector('.splash-min');
        var closeBtn = document.querySelector('.splash-close');
        var statusText = document.querySelector('.splash-status-text');
        var barEl = document.querySelector('.splash-bar');

        /* Window controls via window.desktop.window */
        if (minBtn) {
          minBtn.addEventListener('click', function () {
            if (desktop && desktop.window && typeof desktop.window.minimize === 'function') {
              desktop.window.minimize();
            }
          });
        }
        if (closeBtn) {
          closeBtn.addEventListener('click', function () {
            if (desktop && desktop.window && typeof desktop.window.close === 'function') {
              desktop.window.close();
            }
          });
        }

        /* Decorative status cycling — paused when a real status arrives via IPC */
        var messages = ['正在连接本地服务…', '加载 AI 模型…', '初始化控制台…'];
        var msgIdx = 0;
        var ipcActive = false;
        var ipcTimer = null;

        function setStatus(text) {
          if (statusText && typeof text === 'string' && text.length) {
            statusText.textContent = text;
          }
        }
        function cycleStatus() {
          if (ipcActive) return;
          setStatus(messages[msgIdx % messages.length]);
          msgIdx++;
        }
        cycleStatus();
        setInterval(cycleStatus, 3200);

        /* Real status updates from the main process.
           onStatus(cb) — cb receives a string message. */
        if (desktop && typeof desktop.onStatus === 'function') {
          try {
            desktop.onStatus(function (message) {
              var text = '';
              if (typeof message === 'string') {
                text = message;
              } else if (message && typeof message.message === 'string') {
                /* backward-compatible object payload */
                text = message.message;
              }
              if (!text) return;
              ipcActive = true;
              setStatus(text);
              if (ipcTimer) clearTimeout(ipcTimer);
              ipcTimer = setTimeout(function () { ipcActive = false; }, 6000);
            });
          } catch (e) { /* status updates are non-critical */ }
        }

        /* Keep aria-valuenow roughly in sync with the CSS-driven progress cycle */
        if (barEl) {
          var CYCLE = 3200;
          setInterval(function () {
            var t = (performance.now() % CYCLE) / CYCLE;
            var pct = t < 0.85 ? Math.round((t / 0.85) * 100) : 100;
            barEl.setAttribute('aria-valuenow', String(pct));
          }, 250);
        }
      })();
    </script>

    <style>
    /* ============================================================
       Local AI Stack — Splash v2 (Premium)
       Deep-space glassmorphism · holographic orbit system
       Fully self-contained (no CDN, no external fonts)
       Electron frameless window: 460x340, alwaysOnTop
       ============================================================ */

    :root {
      /* ---- Core surfaces ---- */
      --las-background: #060818;
      --las-deep: #0d1530;
      --las-foreground: #e8ecf5;

      /* ---- Accent palette ---- */
      --las-primary: #38bdf8;      /* sky-blue */
      --las-secondary: #818cf8;    /* indigo */
      --las-accent: #5eead4;       /* teal */
      --las-cyan: #22d3ee;
      --las-muted-fg: #94a3b8;

      /* ---- Typography ---- */
      --las-font-sans: "Segoe UI", "Microsoft YaHei UI", system-ui, -apple-system, sans-serif;
      --las-font-mono: "Cascadia Code", "JetBrains Mono", ui-monospace, "Consolas", monospace;
    }

    /* Animated integer for the percentage counter (Chromium/Electron safe) */
    @property --pct {
      syntax: '<integer>';
      inherits: false;
      initial-value: 0;
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    body {
      font-family: var(--las-font-sans);
      color: var(--las-foreground);
      background-color: #060818;
      /* Gradient mesh: 4 overlapping radial gradients + base linear */
      background-image:
        radial-gradient(circle at 18% 22%, rgba(56, 189, 248, 0.16), transparent 45%),
        radial-gradient(circle at 82% 28%, rgba(129, 140, 248, 0.15), transparent 50%),
        radial-gradient(circle at 28% 86%, rgba(94, 234, 212, 0.11), transparent 50%),
        radial-gradient(circle at 78% 82%, rgba(56, 189, 248, 0.10), transparent 45%),
        linear-gradient(180deg, #060818 0%, #0a0f24 55%, #0d1530 100%);
      -webkit-app-region: drag;
      -webkit-user-select: none;
      user-select: none;
      position: relative;
    }

    /* ---- Floating background orbs (large blurred drifting circles) ---- */
    .splash-orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(42px);
      pointer-events: none;
      z-index: 0;
    }
    .splash-orb.o1 {
      width: 190px; height: 190px; left: -46px; top: 18px;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.42), transparent 70%);
      animation: orb-drift1 15s ease-in-out infinite;
    }
    .splash-orb.o2 {
      width: 220px; height: 220px; right: -64px; bottom: -34px;
      background: radial-gradient(circle, rgba(129, 140, 248, 0.38), transparent 70%);
      animation: orb-drift2 19s ease-in-out infinite;
    }
    .splash-orb.o3 {
      width: 140px; height: 140px; left: 42%; top: 58%;
      background: radial-gradient(circle, rgba(94, 234, 212, 0.22), transparent 70%);
      animation: orb-drift3 17s ease-in-out infinite;
    }

    /* ---- Faint grid texture ---- */
    .splash-grid {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background-image:
        linear-gradient(rgba(148, 163, 184, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(148, 163, 184, 0.04) 1px, transparent 1px);
      background-size: 30px 30px;
      -webkit-mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, #000 30%, transparent 80%);
      mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, #000 30%, transparent 80%);
      opacity: 0.6;
    }

    /* ---- Subtle animated grain overlay (CSS-only) ---- */
    .splash-grain {
      position: fixed; inset: 0; pointer-events: none; z-index: 1;
      opacity: 0.45;
      mix-blend-mode: overlay;
      background-image:
        repeating-linear-gradient(0deg, rgba(148,163,184,0.03) 0, rgba(148,163,184,0.03) 1px, transparent 1px, transparent 3px),
        repeating-linear-gradient(90deg, rgba(148,163,184,0.022) 0, rgba(148,163,184,0.022) 1px, transparent 1px, transparent 3px);
      animation: grain-shift 0.6s steps(4) infinite;
    }

    /* ---- Refined dual-color scanline ---- */
    .splash-scanline {
      position: fixed; left: 0; right: 0; top: 0;
      height: 140px; pointer-events: none; z-index: 1;
      background: linear-gradient(180deg,
        transparent 0%,
        rgba(56, 189, 248, 0.05) 30%,
        rgba(129, 140, 248, 0.08) 50%,
        rgba(56, 189, 248, 0.04) 70%,
        transparent 100%);
      animation: splash-scan 5s linear infinite;
    }

    @keyframes orb-drift1 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(22px, 16px); } }
    @keyframes orb-drift2 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-20px, -14px); } }
    @keyframes orb-drift3 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(16px, -20px); } }
    @keyframes grain-shift {
      0%   { transform: translate(0,0); }
      25%  { transform: translate(-1px, 1px); }
      50%  { transform: translate(1px, -1px); }
      75%  { transform: translate(-1px, -1px); }
      100% { transform: translate(0,0); }
    }
    @keyframes splash-scan {
      0%   { transform: translateY(-140px); opacity: 0; }
      12%  { opacity: 1; }
      88%  { opacity: 1; }
      100% { transform: translateY(340px); opacity: 0; }
    }

    /* ---- Window controls (non-draggable) ---- */
    .splash-wincontrols {
      position: fixed; top: 8px; right: 10px;
      display: flex; gap: 6px;
      -webkit-app-region: no-drag;
      z-index: 20;
    }
    .splash-wincontrols button {
      width: 22px; height: 22px;
      display: inline-flex; align-items: center; justify-content: center;
      border: none; border-radius: 6px;
      background: rgba(148, 163, 184, 0.08);
      color: #94a3b8; cursor: pointer;
      transition: background-color .18s ease, color .18s ease, transform .18s ease;
    }
    .splash-wincontrols button:hover { background: rgba(148, 163, 184, 0.18); color: #cbd5e1; }
    .splash-wincontrols button:active { transform: scale(0.92); }
    .splash-wincontrols button.splash-close:hover { background: rgba(244, 63, 94, 0.85); color: #ffffff; }
    .splash-wincontrols svg { width: 12px; height: 12px; display: block; }

    /* ---- Centered shell ---- */
    .splash-shell {
      position: relative; z-index: 5;
      height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 16px;
      padding: 24px 24px 24px;
    }

    /* ---- Orbit stage ---- */
    .splash-orbit-stage {
      position: relative;
      width: 148px; height: 148px;
      display: flex; align-items: center; justify-content: center;
    }

    /* Holographic rings — conic gradient color shift (sky-blue → indigo → teal) */
    .holo-ring {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      will-change: transform;
    }

    /* Outermost energy field — faint, pulsing */
    .holo-ring.field {
      inset: 0;
      background: conic-gradient(from 0deg,
        rgba(56,189,248,0.25), rgba(129,140,248,0.20),
        rgba(94,234,212,0.18), rgba(56,189,248,0.25));
      -webkit-mask: radial-gradient(circle at center, transparent 70px, #000 71px, #000 73px, transparent 74px);
      mask: radial-gradient(circle at center, transparent 70px, #000 71px, #000 73px, transparent 74px);
      animation: holo-spin 24s linear infinite, field-pulse 4.5s ease-in-out infinite;
    }

    /* Outer dashed ring */
    .holo-ring.dashed {
      inset: 4px;
      background-image:
        repeating-conic-gradient(#fff 0deg 8deg, transparent 8deg 16deg),
        conic-gradient(from 45deg, #38bdf8, #818cf8, #5eead4, #38bdf8);
      background-blend-mode: destination-in, normal;
      -webkit-mask: radial-gradient(circle at center, transparent 66px, #000 67px, #000 69px, transparent 70px);
      mask: radial-gradient(circle at center, transparent 66px, #000 67px, #000 69px, transparent 70px);
      opacity: 0.88;
      animation: holo-spin-rev 16s linear infinite;
    }

    /* Middle solid gradient ring */
    .holo-ring.solid {
      inset: 20px;
      background: conic-gradient(from 120deg,
        rgba(56,189,248,0.78), rgba(129,140,248,0.78),
        rgba(94,234,212,0.72), rgba(56,189,248,0.78));
      -webkit-mask: radial-gradient(circle at center, transparent 50px, #000 51px, #000 53px, transparent 54px);
      mask: radial-gradient(circle at center, transparent 50px, #000 51px, #000 53px, transparent 54px);
      animation: holo-spin 13s linear infinite;
    }

    /* Inner dotted ring */
    .holo-ring.dotted {
      inset: 28px;
      background-image:
        repeating-conic-gradient(#fff 0deg 2deg, transparent 2deg 7deg),
        conic-gradient(from 200deg, #38bdf8, #818cf8, #5eead4, #38bdf8);
      background-blend-mode: destination-in, normal;
      -webkit-mask: radial-gradient(circle at center, transparent 42px, #000 43px, #000 45px, transparent 46px);
      mask: radial-gradient(circle at center, transparent 42px, #000 43px, #000 45px, transparent 46px);
      opacity: 0.85;
      animation: holo-spin-rev 11s linear infinite;
    }

    @keyframes holo-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes holo-spin-rev { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }
    @keyframes field-pulse { 0%,100% { opacity: 0.35; } 50% { opacity: 0.8; } }

    /* ---- Energy core: multi-layer glow + animated conic border ---- */
    .splash-mascot-core {
      position: relative;
      width: 84px; height: 84px;
      border-radius: 50%;
      background: radial-gradient(circle at 50% 45%,
        rgba(56, 189, 248, 0.24), rgba(56, 189, 248, 0.06) 60%, transparent 75%);
      display: flex; align-items: center; justify-content: center;
      /* inner soft glow + outer energy aura */
      box-shadow:
        0 0 0 1px rgba(56, 189, 248, 0.30),
        0 0 20px 3px rgba(56, 189, 248, 0.32),
        0 0 44px 8px rgba(129, 140, 248, 0.20),
        inset 0 0 20px rgba(129, 140, 248, 0.20);
      animation: core-pulse 3.4s ease-in-out infinite;
    }

    /* Animated rotating conic-gradient border on the core edge */
    .splash-mascot-core::before {
      content: "";
      position: absolute;
      inset: -2px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, #38bdf8, #818cf8, #5eead4, #22d3ee, #38bdf8);
      -webkit-mask: radial-gradient(circle at center, transparent calc(50% - 1.5px), #000 calc(50% - 1px), #000 calc(50% + 1px), transparent calc(50% + 1.5px));
      mask: radial-gradient(circle at center, transparent calc(50% - 1.5px), #000 calc(50% - 1px), #000 calc(50% + 1px), transparent calc(50% + 1.5px));
      opacity: 0.9;
      animation: core-conic-rotate 6s linear infinite;
      z-index: 1;
    }

    /* Pulsing concentric waves emanating from the core (staggered) */
    .core-wave {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1px solid transparent;
      background:
        linear-gradient(135deg, rgba(56,189,248,0.6), rgba(129,140,248,0.5), rgba(94,234,212,0.4)) border-box;
      -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      opacity: 0;
      z-index: 1;
      /* subtle distortion + multi-layer energy glow */
      box-shadow:
        0 0 8px rgba(56,189,248,0.28),
        inset 0 0 6px rgba(129,140,248,0.22),
        0 0 16px rgba(94,234,212,0.16);
      animation: core-wave 3.6s ease-out infinite;
    }
    .core-wave.w1 { animation-delay: 0s;   background: linear-gradient(135deg, rgba(56,189,248,0.75), rgba(56,189,248,0.3)) border-box; }
    .core-wave.w2 { animation-delay: 1.2s; background: linear-gradient(135deg, rgba(129,140,248,0.75), rgba(129,140,248,0.3)) border-box; }
    .core-wave.w3 { animation-delay: 2.4s; background: linear-gradient(135deg, rgba(94,234,212,0.70), rgba(94,234,212,0.3)) border-box; }

    .splash-mascot {
      position: relative;
      z-index: 2;
      width: 66px; height: 66px;
      border-radius: 16px;
      display: block;
      animation: mascot-breathe 3.4s ease-in-out infinite;
      filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.4));
    }

    @keyframes core-pulse {
      0%, 100% {
        box-shadow:
          0 0 0 1px rgba(56, 189, 248, 0.30),
          0 0 18px 2px rgba(56, 189, 248, 0.26),
          0 0 38px 6px rgba(129, 140, 248, 0.16),
          inset 0 0 18px rgba(129, 140, 248, 0.18);
      }
      50% {
        box-shadow:
          0 0 0 1px rgba(56, 189, 248, 0.50),
          0 0 28px 4px rgba(56, 189, 248, 0.42),
          0 0 56px 10px rgba(129, 140, 248, 0.28),
          inset 0 0 24px rgba(129, 140, 248, 0.30);
      }
    }
    @keyframes core-conic-rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes core-wave {
      0%   { transform: scale(0.92); opacity: 0; }
      18%  { opacity: 0.7; }
      100% { transform: scale(1.8); opacity: 0; }
    }
    @keyframes mascot-breathe {
      0%, 100% { transform: scale(1) rotate(0deg); opacity: 0.96; }
      50%      { transform: scale(1.06) rotate(-1.5deg); opacity: 1; }
    }

    /* ---- Enhanced orbiting particles (6, varied size/color/radius + trailing glow) ---- */
    .splash-particle {
      --r: 56px;
      position: absolute;
      top: 50%; left: 50%;
      border-radius: 50%;
      animation: particle-orbit 6s linear infinite;
      animation-delay: 0s;
      will-change: transform;
    }
    @keyframes particle-orbit {
      from { transform: rotate(0deg)   translateX(var(--r)) rotate(0deg); }
      to   { transform: rotate(360deg) translateX(var(--r)) rotate(-360deg); }
    }

    .splash-particle.p1 { --r: 64px; width: 6px;  height: 6px;  margin: -3px 0 0 -3px;     background: #38bdf8; box-shadow: 0 0 8px 2px rgba(56,189,248,0.9), 0 0 15px 4px rgba(56,189,248,0.4);  animation-duration: 6s;   animation-delay: -1s; }
    .splash-particle.p2 { --r: 52px; width: 4px;  height: 4px;  margin: -2px 0 0 -2px;     background: #818cf8; box-shadow: 0 0 7px 2px rgba(129,140,248,0.9),0 0 13px 3px rgba(129,140,248,0.4); animation-duration: 7.5s; animation-delay: -2.5s; }
    .splash-particle.p3 { --r: 68px; width: 5px;  height: 5px;  margin: -2.5px 0 0 -2.5px; background: #5eead4; box-shadow: 0 0 8px 2px rgba(94,234,212,0.85),0 0 14px 4px rgba(94,234,212,0.35); animation-duration: 5.5s; animation-delay: -0.5s; }
    .splash-particle.p4 { --r: 44px; width: 4.5px;height: 4.5px;margin: -2.25px 0 0 -2.25px;background:#22d3ee; box-shadow: 0 0 7px 2px rgba(34,211,238,0.85),0 0 12px 3px rgba(34,211,238,0.35); animation-duration: 8s;   animation-delay: -3s; }
    .splash-particle.p5 { --r: 58px; width: 3px;  height: 3px;  margin: -1.5px 0 0 -1.5px; background: #38bdf8; box-shadow: 0 0 6px 2px rgba(56,189,248,0.85),0 0 10px 3px rgba(56,189,248,0.35);  animation-duration: 6.8s; animation-delay: -1.8s; }
    .splash-particle.p6 { --r: 40px; width: 5.5px;height: 5.5px;margin: -2.75px 0 0 -2.75px;background:#818cf8; box-shadow: 0 0 8px 2px rgba(129,140,248,0.9),0 0 13px 4px rgba(129,140,248,0.4);  animation-duration: 7s;   animation-delay: -4s; }

    /* ---- Twinkling sparks near the core ---- */
    .splash-spark {
      position: absolute;
      z-index: 3;
      width: 2px; height: 2px;
      margin: -1px 0 0 -1px;
      border-radius: 50%;
      background: #e8ecf5;
      box-shadow: 0 0 4px 1px rgba(255, 255, 255, 0.9);
      animation: spark-twinkle 1.8s ease-in-out infinite;
    }
    .splash-spark.s1 { top: 12%; left: 78%; animation-delay: 0s; }
    .splash-spark.s2 { top: 74%; left: 16%; animation-delay: -0.9s; }
    @keyframes spark-twinkle {
      0%, 100% { opacity: 0; transform: scale(0.5); }
      50%      { opacity: 1; transform: scale(1.3); }
    }

    /* ---- Typography ---- */
    .splash-titles {
      text-align: center;
      display: flex; flex-direction: column;
      gap: 5px;
      margin-top: 2px;
    }
    .splash-title {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 0.5px;
      line-height: 1.2;
      color: #e8ecf5;
      margin: 0;
      text-shadow:
        0 0 4px rgba(232, 236, 245, 0.8),
        0 0 10px rgba(56, 189, 248, 0.6),
        0 0 22px rgba(56, 189, 248, 0.45),
        0 0 38px rgba(129, 140, 248, 0.35),
        0 2px 8px rgba(0, 0, 0, 0.5);
      animation: title-glow 3.4s ease-in-out infinite, title-spacing 4.5s ease-in-out infinite;
    }
    .splash-title .ai-grad {
      background: linear-gradient(90deg, #38bdf8 0%, #818cf8 50%, #5eead4 100%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
      animation: ai-grad-shimmer 4s ease-in-out infinite;
    }
    @keyframes ai-grad-shimmer {
      0%, 100% { background-position: 0% center; }
      50%      { background-position: 100% center; }
    }
    .splash-subtitle {
      font-size: 12px;
      color: #94a3b8;
      letter-spacing: 0.3px;
      margin: 0;
      font-weight: 400;
    }
    .splash-tagline {
      font-family: var(--las-font-mono);
      font-size: 8.5px;
      letter-spacing: 3px;
      color: rgba(148, 163, 184, 0.6);
      margin: 3px 0 0;
      font-weight: 400;
    }

    /* ---- Premium loading sequence (4-layer bar) ---- */
    .splash-loader {
      width: 260px;
      margin-top: 2px;
      display: flex; flex-direction: column;
      align-items: stretch;
      gap: 9px;
    }
    .splash-bar-wrap {
      position: relative;
      width: 260px;
      height: 10px;
      display: flex; align-items: center;
    }
    /* glow underneath the fill */
    .splash-bar-glow {
      position: absolute;
      top: 50%; left: 0;
      transform: translateY(-50%);
      height: 8px;
      width: 0%;
      border-radius: 99px;
      background: linear-gradient(90deg, rgba(56,189,248,0.65), rgba(129,140,248,0.65));
      filter: blur(5px);
      animation: load-fill 3.2s cubic-bezier(0.65, 0, 0.35, 1) infinite;
    }
    .splash-bar {
      position: relative;
      width: 100%;
      height: 5px;
      border-radius: 99px;
      background: rgba(148, 163, 184, 0.15); /* base track */
      overflow: hidden;
      box-shadow: inset 0 0 0 1px rgba(148, 163, 184, 0.1);
    }
    .splash-bar-fill {
      position: absolute;
      top: 0; left: 0;
      height: 100%;
      width: 0%;
      border-radius: 99px;
      background: linear-gradient(90deg, #38bdf8, #6ee7f9, #818cf8, #5eead4, #38bdf8);
      background-size: 200% 100%;
      box-shadow: 0 0 8px 1px rgba(56, 189, 248, 0.6);
      animation: load-fill 3.2s cubic-bezier(0.65, 0, 0.35, 1) infinite, bar-flow 2s linear infinite;
    }
    .splash-bar-shimmer {
      position: absolute;
      top: 0; left: -60%;
      width: 45%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.6), transparent);
      animation: bar-shimmer 1.6s ease-in-out infinite;
    }
    @keyframes load-fill {
      0%   { width: 0%; }
      85%  { width: 100%; }
      100% { width: 100%; }
    }
    @keyframes bar-shimmer {
      0%   { left: -60%; }
      100% { left: 160%; }
    }

    /* status row + percentage counter */
    .splash-bar-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 260px;
    }
    .splash-status {
      font-size: 11.5px;
      color: #94a3b8;
      letter-spacing: 0.3px;
      margin: 0;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-weight: 400;
    }
    .splash-status-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #38bdf8;
      box-shadow: 0 0 6px 1px rgba(56, 189, 248, 0.8);
      animation: status-blink 1.4s ease-in-out infinite;
    }
    @keyframes status-blink {
      0%, 100% { opacity: 0.4; transform: scale(0.85); }
      50%      { opacity: 1;   transform: scale(1.15); }
    }
    .splash-pct {
      font-family: var(--las-font-mono);
      font-size: 10.5px;
      color: rgba(56, 189, 248, 0.9);
      letter-spacing: 0.5px;
      font-variant-numeric: tabular-nums;
    }
    .splash-pct-num {
      --pct: 0;
      counter-reset: pct var(--pct);
      animation: pct-cycle 3.2s cubic-bezier(0.65, 0, 0.35, 1) infinite;
    }
    .splash-pct-num::after { content: counter(pct); }
    @keyframes pct-cycle {
      0%   { --pct: 0; }
      85%  { --pct: 100; }
      100% { --pct: 100; }
    }

    /* ---- Enhanced footer ---- */
    .splash-foot {
      position: fixed;
      bottom: 10px; left: 0; right: 0;
      text-align: center;
      z-index: 5;
      pointer-events: none;
    }
    .splash-foot-line {
      width: 120px; height: 1px;
      margin: 0 auto 6px;
      background: linear-gradient(90deg, transparent, rgba(56,189,248,0.5), rgba(129,140,248,0.5), transparent);
    }
    .splash-foot-text {
      font-family: var(--las-font-mono);
      font-size: 9px;
      color: rgba(124, 138, 165, 0.6);
      letter-spacing: 0.8px;
      margin: 0;
    }

    /* ---- Reduced motion ---- */
    @media (prefers-reduced-motion: reduce) {
      .holo-ring, .core-wave, .splash-mascot-core, .splash-mascot-core::before,
      .splash-mascot, .splash-particle, .splash-spark, .splash-orb,
      .splash-bar-fill, .splash-bar-glow, .splash-bar-shimmer, .splash-pct-num,
      .splash-status-dot, .splash-scanline, .splash-grain,
      .holo-frame, .holo-corner, .splash-vignette, .splash-title .ai-grad,
      .splash-progress-ring .ring-fill, .splash-starfield span, .splash-title {
        animation: none !important;
      }
      .splash-bar-fill, .splash-bar-glow { width: 60%; }
      .splash-pct-num { --pct: 60; }
      .splash-progress-ring .ring-fill { stroke-dashoffset: 120.64; }
    }

    /* ============================================================
       v3 ENHANCEMENTS — Holographic frame, vignette
       ============================================================ */

    /* ---- Holographic frame border ---- */
    .holo-frame {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 15;
      border-radius: 0;
    }
    .holo-frame::before {
      content: "";
      position: absolute;
      inset: 0;
      border: 1px solid transparent;
      border-image: linear-gradient(135deg,
        rgba(56,189,248,0.4),
        rgba(129,140,248,0.2),
        rgba(94,234,212,0.3),
        rgba(129,140,248,0.2),
        rgba(56,189,248,0.4)) 1;
      opacity: 0.5;
    }
    .holo-frame::after {
      content: "";
      position: absolute;
      inset: 0;
      border: 1px solid transparent;
      background:
        linear-gradient(135deg, rgba(56,189,248,0.12), transparent 20%, transparent 80%, rgba(94,234,212,0.1)) border-box;
      -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      animation: holo-border-shift 8s ease-in-out infinite;
    }
    @keyframes holo-border-shift {
      0%, 100% { opacity: 0.3; }
      50%      { opacity: 0.7; }
    }

    /* ---- Holographic corner brackets ---- */
    .holo-corner {
      position: fixed;
      width: 18px; height: 18px;
      z-index: 16;
      pointer-events: none;
    }
    .holo-corner::before, .holo-corner::after {
      content: "";
      position: absolute;
      background: linear-gradient(90deg, rgba(56,189,248,0.6), rgba(94,234,212,0.4));
      box-shadow: 0 0 6px rgba(56,189,248,0.3);
    }
    .holo-corner::before { width: 100%; height: 2px; }
    .holo-corner::after  { width: 2px; height: 100%; }
    .h-tl { top: 6px; left: 6px; }
    .h-tl::before { top: 0; left: 0; }
    .h-tl::after  { top: 0; left: 0; }
    .h-tr { top: 6px; right: 6px; }
    .h-tr::before { top: 0; right: 0; }
    .h-tr::after  { top: 0; right: 0; }
    .h-bl { bottom: 6px; left: 6px; }
    .h-bl::before { bottom: 0; left: 0; }
    .h-bl::after  { bottom: 0; left: 0; }
    .h-br { bottom: 6px; right: 6px; }
    .h-br::before { bottom: 0; right: 0; }
    .h-br::after  { bottom: 0; right: 0; }

    /* ---- Subtle vignette ---- */
    .splash-vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 14;
      background: radial-gradient(ellipse 100% 100% at 50% 50%,
        transparent 50%,
        rgba(6, 8, 24, 0.15) 80%,
        rgba(6, 8, 24, 0.4) 100%);
    }

    /* ============================================================
       v4 ENHANCEMENTS — Progress ring, particle trails, flowing bar,
       gradient waves, starfield, neon title glow
       ============================================================ */

    /* ---- v4: Circular progress ring around the mascot core ---- */
    .splash-progress-ring {
      position: absolute;
      top: 50%; left: 50%;
      width: 100px; height: 100px;
      margin: -50px 0 0 -50px;
      transform: rotate(-90deg); /* start fill stroke from 12 o'clock */
      z-index: 3;
      pointer-events: none;
      overflow: visible;
    }
    .splash-progress-ring .ring-track {
      fill: none;
      stroke: rgba(148, 163, 184, 0.12);
      stroke-width: 2.5;
    }
    .splash-progress-ring .ring-fill {
      fill: none;
      stroke: url(#ringGrad);
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-dasharray: 301.6;
      stroke-dashoffset: 301.6;
      filter: drop-shadow(0 0 3px rgba(56, 189, 248, 0.55));
      animation: ring-progress 3.2s cubic-bezier(0.65, 0, 0.35, 1) infinite;
    }
    @keyframes ring-progress {
      0%   { stroke-dashoffset: 301.6; }
      85%  { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 0; }
    }

    /* ---- v4: Particle comet glow trails ---- */
    .splash-particle::after {
      content: "";
      position: absolute;
      top: 50%;
      right: 50%;
      width: 16px;
      height: 1px;
      transform: translateY(-50%);
      border-radius: 99px;
      background: linear-gradient(90deg, rgba(232, 236, 245, 0.6), rgba(56, 189, 248, 0.2), transparent);
      opacity: 0.5;
      pointer-events: none;
      filter: blur(0.4px);
    }

    /* ---- v4: Flowing gradient shift on the loading bar ---- */
    @keyframes bar-flow {
      0%   { background-position: 0% 50%; }
      100% { background-position: 200% 50%; }
    }

    /* ---- v4: Starfield background ---- */
    .splash-starfield {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
    }
    .splash-starfield span {
      position: absolute;
      display: block;
      width: 1.5px; height: 1.5px;
      border-radius: 50%;
      background: #e8ecf5;
      box-shadow: 0 0 3px 1px rgba(232, 236, 245, 0.7);
      opacity: 0;
      animation: star-twinkle 3s ease-in-out infinite;
    }
    @keyframes star-twinkle {
      0%, 100% { opacity: 0.1; transform: scale(0.6); }
      50%      { opacity: 0.9; transform: scale(1.1); }
    }

    /* ---- v4: Neon title glow pulse + letter-spacing breathe ---- */
    @keyframes title-glow {
      0%, 100% {
        text-shadow:
          0 0 4px rgba(232, 236, 245, 0.7),
          0 0 8px rgba(56, 189, 248, 0.45),
          0 0 18px rgba(56, 189, 248, 0.3),
          0 0 30px rgba(129, 140, 248, 0.22),
          0 2px 8px rgba(0, 0, 0, 0.5);
      }
      50% {
        text-shadow:
          0 0 6px rgba(232, 236, 245, 0.95),
          0 0 14px rgba(56, 189, 248, 0.75),
          0 0 28px rgba(56, 189, 248, 0.55),
          0 0 48px rgba(129, 140, 248, 0.45),
          0 2px 8px rgba(0, 0, 0, 0.5);
      }
    }
    @keyframes title-spacing {
      0%, 100% { letter-spacing: 0.5px; }
      50%      { letter-spacing: 0.9px; }
    }

/* ============================================================
   v5 ULTRA VISUAL ENHANCEMENTS — Splash Screen
   Liquid wave bar · Particle connections · Holographic scan
   Typing effect · Enhanced energy core · Premium polish
   ============================================================ */

/* ---- V5-1: Liquid wave loading bar ---- */
.splash-bar {

<script>
/* v5: Typing effect for status text */
(function () {
  var statusText = document.querySelector('.splash-status-text');
  if (!statusText) return;
  var originalText = statusText.textContent;
  var typingTimer = null;

  function typeText(text) {
    if (typingTimer) clearInterval(typingTimer);
    statusText.textContent = '';
    var i = 0;
    typingTimer = setInterval(function () {
      if (i < text.length) {
        statusText.textContent = text.substring(0, i + 1);
        i++;
      } else {
        clearInterval(typingTimer);
      }
    }, 40);
  }

  /* Override the original setStatus to add typing */
  var originalSetStatus = window.setStatus;
  if (typeof originalSetStatus === 'function') {
    window.setStatus = function (text) {
      typeText(text);
    };
  } else {
    typeText(originalText);
  }
})();
</script>

<script>
/* ============================================================
   v6 GENESIS — Interactive Enhancements
   Boot sequence · Magnetic particles
   ============================================================ */
(function () {
  /* Boot sequence terminal text */
  var bootContainer = document.createElement('div');
  bootContainer.className = 'boot-seq';
  document.body.appendChild(bootContainer);

  var bootLines = [
    '> initializing kernel modules...',
    '> loading ai inference engine...',
    '> establishing local network bridge...',
    '> mounting model registry...',
    '> calibrating quantum renderer...',
    '> system ready.'
  ];

  var lineIdx = 0;
  function addBootLine() {
    if (lineIdx >= bootLines.length) {
      setTimeout(function () {
        bootContainer.innerHTML = '';
        lineIdx = 0;
        addBootLine();
      }, 3000);
      return;
    }
    var line = document.createElement('div');
    line.className = 'boot-seq-line';
    line.textContent = bootLines[lineIdx];
    bootContainer.appendChild(line);
    lineIdx++;
    setTimeout(addBootLine, 600);
  }
  setTimeout(addBootLine, 800);

  /* Magnetic particle attraction toward cursor */
  var stage = document.querySelector('.splash-orbit-stage');
  var particles = document.querySelectorAll('.splash-particle');
  if (stage && particles.length) {
    var mouseX = 0, mouseY = 0, inStage = false;
    stage.addEventListener('mousemove', function (e) {
      var rect = stage.getBoundingClientRect();
      mouseX = e.clientX - rect.left - rect.width / 2;
      mouseY = e.clientY - rect.top - rect.height / 2;
      inStage = true;
    });
    stage.addEventListener('mouseleave', function () {
      inStage = false;
      particles.forEach(function (p) { p.style.transform = ''; });
    });
    /* Subtle magnetic pull — applied as a gentle nudge via CSS variable */
    if (stage) {
      stage.addEventListener('mousemove', function (e) {
        var rect = stage.getBoundingClientRect();
        var dx = (e.clientX - rect.left - rect.width / 2) / rect.width;
        var dy = (e.clientY - rect.top - rect.height / 2) / rect.height;
        stage.style.setProperty('--mag-x', (dx * 6).toFixed(1) + 'px');
        stage.style.setProperty('--mag-y', (dy * 6).toFixed(1) + 'px');
      });
    }
  }
})();
</script>
