<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Local AI Stack</title>
<style>
  /* ============================================================
     Local AI Stack — Splash / Loading
     Deep-space glassmorphism with orbiting mascot animation
     Fully self-contained · no external dependencies
     ============================================================ */

  :root {
    --bg-base: #060818;
    --bg-deep: #0d1530;
    --accent: #38bdf8;
    --accent-2: #818cf8;
    --text: #e8ecf5;
    --muted: #94a3b8;
    --font: "Segoe UI", "Microsoft YaHei UI", system-ui, -apple-system, sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }

  body {
    font-family: var(--font);
    color: var(--text);
    background-color: var(--bg-base);
    background-image:
      radial-gradient(ellipse 70% 60% at 80% -20%, rgba(56, 189, 248, 0.16), transparent 60%),
      radial-gradient(ellipse 70% 60% at -10% 110%, rgba(129, 140, 248, 0.14), transparent 60%),
      linear-gradient(180deg, var(--bg-base) 0%, var(--bg-deep) 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    user-select: none;
    -webkit-app-region: drag;
    position: relative;
  }

  /* ---- Faint grid texture overlay ---- */
  .grid-overlay {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image:
      linear-gradient(rgba(148, 163, 184, 0.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(148, 163, 184, 0.045) 1px, transparent 1px);
    background-size: 26px 26px;
    -webkit-mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, #000 30%, transparent 80%);
    mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, #000 30%, transparent 80%);
    opacity: 0.7;
    z-index: 0;
  }

  /* ---- Scanning line traveling down ---- */
  .scanline {
    position: fixed;
    left: 0; right: 0; top: 0;
    height: 120px;
    pointer-events: none;
    background: linear-gradient(180deg, transparent 0%, rgba(56, 189, 248, 0.06) 45%, rgba(129, 140, 248, 0.05) 55%, transparent 100%);
    z-index: 0;
    animation: scan 4.5s linear infinite;
  }
  @keyframes scan {
    0%   { transform: translateY(-120px); opacity: 0; }
    12%  { opacity: 1; }
    88%  { opacity: 1; }
    100% { transform: translateY(340px); opacity: 0; }
  }

  /* ---- Window controls ---- */
  .win-btns {
    position: fixed;
    top: 8px;
    right: 10px;
    display: flex;
    gap: 6px;
    -webkit-app-region: no-drag;
    z-index: 20;
  }
  .win-btn {
    width: 22px; height: 22px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: none;
    border-radius: 6px;
    background: rgba(148, 163, 184, 0.08);
    color: var(--muted);
    cursor: pointer;
    transition: background .18s ease, color .18s ease, transform .18s ease;
  }
  .win-btn:hover { background: rgba(148, 163, 184, 0.18); color: #cbd5e1; }
  .win-btn:active { transform: scale(0.92); }
  .win-btn.close:hover { background: rgba(244, 63, 94, 0.85); color: #fff; }
  .win-btn svg { width: 12px; height: 12px; display: block; }

  /* ---- Mascot orbit system ---- */
  .orbit-stage {
    position: relative;
    z-index: 5;
    width: 132px;
    height: 132px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Outer dashed orbit ring */
  .orbit-outer {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 1.5px dashed rgba(56, 189, 248, 0.5);
    animation: spin 9s linear infinite;
    -webkit-mask-image: conic-gradient(#000 0deg 350deg, transparent 350deg 360deg);
    mask-image: conic-gradient(#000 0deg 350deg, transparent 350deg 360deg);
  }

  /* Middle thin orbit ring */
  .orbit-mid {
    position: absolute;
    inset: 10px;
    border-radius: 50%;
    border: 1px solid rgba(129, 140, 248, 0.22);
    animation: spin-rev 14s linear infinite;
  }

  /* Inner glow container holding the mascot */
  .mascot-core {
    position: relative;
    width: 84px;
    height: 84px;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 45%, rgba(56, 189, 248, 0.18), rgba(56, 189, 248, 0.04) 60%, transparent 75%);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow:
      0 0 0 1px rgba(56, 189, 248, 0.25),
      0 0 22px 2px rgba(56, 189, 248, 0.28),
      inset 0 0 18px rgba(129, 140, 248, 0.18);
    animation: pulse 3.2s ease-in-out infinite;
  }
  .mascot-core::before {
    content: "";
    position: absolute;
    inset: -3px;
    border-radius: 50%;
    border: 1px solid rgba(129, 140, 248, 0.35);
    opacity: 0.6;
    animation: pulse-ring 3.2s ease-in-out infinite;
  }
  .mascot-core img {
    width: 66px; height: 66px;
    border-radius: 16px;
    display: block;
    animation: breathe 3.2s ease-in-out infinite;
    filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.35));
  }

  /* Orbiting particle dots */
  .particle {
    position: absolute;
    top: 50%; left: 50%;
    width: 5px; height: 5px;
    margin: -2.5px 0 0 -2.5px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 6px 1px rgba(56, 189, 248, 0.9);
  }
  .particle.p2 { background: var(--accent-2); box-shadow: 0 0 6px 1px rgba(129, 140, 248, 0.9); width: 4px; height: 4px; margin: -2px 0 0 -2px; }
  .particle.p3 { background: #6ee7f9; box-shadow: 0 0 7px 1px rgba(110, 231, 249, 0.85); }
  .particle.p4 { background: #a5b4fc; box-shadow: 0 0 5px 1px rgba(165, 180, 252, 0.85); width: 3.5px; height: 3.5px; margin: -1.75px 0 0 -1.75px; }
  .particle.p1 { animation: orbit-a 5.5s linear infinite; }
  .particle.p2 { animation: orbit-b 7.5s linear infinite; }
  .particle.p3 { animation: orbit-c 6.2s linear infinite reverse; }
  .particle.p4 { animation: orbit-d 9s linear infinite; }

  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  @keyframes spin-rev { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 1px rgba(56,189,248,0.25), 0 0 18px 2px rgba(56,189,248,0.22), inset 0 0 16px rgba(129,140,248,0.15); }
    50%      { box-shadow: 0 0 0 1px rgba(56,189,248,0.45), 0 0 30px 4px rgba(56,189,248,0.4),  inset 0 0 22px rgba(129,140,248,0.28); }
  }
  @keyframes pulse-ring {
    0%, 100% { opacity: 0.35; transform: scale(1); }
    50%      { opacity: 0.7;  transform: scale(1.05); }
  }
  @keyframes breathe {
    0%, 100% { transform: scale(1) rotate(0deg); opacity: 0.96; }
    50%      { transform: scale(1.06) rotate(-1.5deg); opacity: 1; }
  }
  @keyframes orbit-a { from { transform: rotate(0deg)   translateX(58px) rotate(0deg); }   to { transform: rotate(360deg) translateX(58px) rotate(-360deg); } }
  @keyframes orbit-b { from { transform: rotate(45deg)  translateX(52px) rotate(-45deg); }  to { transform: rotate(405deg) translateX(52px) rotate(-405deg); } }
  @keyframes orbit-c { from { transform: rotate(120deg) translateX(64px) rotate(-120deg); } to { transform: rotate(480deg) translateX(64px) rotate(-480deg); } }
  @keyframes orbit-d { from { transform: rotate(200deg) translateX(48px) rotate(-200deg); } to { transform: rotate(560deg) translateX(48px) rotate(-560deg); } }

  /* ---- Title ---- */
  .titles { text-align: center; display: flex; flex-direction: column; gap: 5px; margin-top: 2px; z-index: 5; }
  h1 {
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 0.5px;
    line-height: 1.2;
    color: var(--text);
  }
  h1 span {
    background: linear-gradient(90deg, var(--accent) 0%, var(--accent-2) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
  }
  .sub {
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.3px;
    font-weight: 400;
  }

  /* ---- Loading bar ---- */
  .loader { width: 260px; margin-top: 2px; display: flex; flex-direction: column; align-items: center; gap: 9px; z-index: 5; }
  .bar {
    position: relative;
    width: 260px;
    height: 5px;
    border-radius: 99px;
    background: rgba(148, 163, 184, 0.15);
    overflow: hidden;
    box-shadow: inset 0 0 0 1px rgba(148, 163, 184, 0.08);
  }
  .bar-fill {
    position: absolute;
    top: 0; left: 0;
    width: 42%;
    height: 100%;
    border-radius: 99px;
    background: linear-gradient(90deg, var(--accent) 0%, var(--accent-2) 100%);
    box-shadow: 0 0 10px 1px rgba(56, 189, 248, 0.55);
    animation: load-slide 2.4s cubic-bezier(0.65, 0, 0.35, 1) infinite;
  }
  .bar-shimmer {
    position: absolute;
    top: 0; left: -60%;
    width: 60%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.55), transparent);
    animation: shimmer 1.8s ease-in-out infinite;
  }
  @keyframes load-slide { 0% { left: -42%; } 100% { left: 100%; } }
  @keyframes shimmer { 0% { left: -60%; } 100% { left: 160%; } }

  #status {
    font-size: 11.5px;
    color: var(--muted);
    min-height: 16px;
    letter-spacing: 0.3px;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-weight: 400;
  }
  .status-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 6px 1px rgba(56, 189, 248, 0.8);
    animation: blink 1.4s ease-in-out infinite;
  }
  @keyframes blink {
    0%, 100% { opacity: 0.4; transform: scale(0.85); }
    50%      { opacity: 1;   transform: scale(1.15); }
  }

  /* ---- Brand footer mark ---- */
  .foot {
    position: fixed;
    bottom: 10px;
    left: 0; right: 0;
    text-align: center;
    font-size: 9.5px;
    color: rgba(124, 138, 165, 0.55);
    letter-spacing: 0.6px;
    z-index: 5;
    pointer-events: none;
  }

  /* ---- Reduced motion ---- */
  @media (prefers-reduced-motion: reduce) {
    .orbit-outer, .orbit-mid, .mascot-core, .mascot-core::before, .mascot-core img,
    .particle, .bar-fill, .bar-shimmer, .status-dot, .scanline {
      animation: none !important;
    }
    .bar-fill { left: 0; width: 60%; }
  }
</style>
</head>
<body>
  <div class="grid-overlay" aria-hidden="true"></div>
  <div class="scanline" aria-hidden="true"></div>

  <div class="win-btns">
    <button class="win-btn" id="btn-min" title="最小化" aria-label="最小化">
      <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><rect x="3" y="7.25" width="10" height="1.5" rx="0.75" fill="currentColor"/></svg>
    </button>
    <button class="win-btn close" id="btn-close" title="关闭" aria-label="关闭">
      <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </button>
  </div>

  <div class="orbit-stage" aria-label="应用图标动画">
    <div class="orbit-mid" aria-hidden="true"></div>
    <div class="orbit-outer" aria-hidden="true"></div>
    <div class="mascot-core">
      <img src="../assets/nailong-mascot.svg" alt="Local AI Stack 吉祥物" draggable="false" />
    </div>
    <span class="particle p1" aria-hidden="true"></span>
    <span class="particle p2" aria-hidden="true"></span>
    <span class="particle p3" aria-hidden="true"></span>
    <span class="particle p4" aria-hidden="true"></span>
  </div>

  <div class="titles">
    <h1>Local <span>AI</span> Stack</h1>
    <div class="sub">本地私有 AI 控制台 · 桌面版</div>
  </div>

  <div class="loader">
    <div class="bar" role="progressbar" aria-label="加载进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="42">
      <div class="bar-fill"></div>
      <div class="bar-shimmer" aria-hidden="true"></div>
    </div>
    <div id="status"><span class="status-dot" aria-hidden="true"></span><span id="status-text">正在连接本地服务…</span></div>
  </div>

  <div class="foot">LOCAL AI STACK · v1.0.0</div>

  <script>
    document.getElementById("btn-close").addEventListener("click", () => window.desktop.window.close());
    document.getElementById("btn-min").addEventListener("click", () => window.desktop.window.minimize());

    // Status updates pushed from the main process (msg is a string)
    if (window.desktop && window.desktop.onStatus) {
      window.desktop.onStatus((msg) => {
        document.getElementById("status-text").textContent = msg;
      });
    }
  </script>
</body>
</html>
