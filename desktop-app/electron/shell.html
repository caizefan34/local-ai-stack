  <script>
  /* ============================================================
     Electron IPC bridge — window.desktop
     Guarded with typeof checks so the page also works in browser preview.
     nav: back() / forward() / reload() / select(page) / onState(cb)
     window: minimize() / toggleMaximize() / close() / onMaximized(cb)
     ============================================================ */
  (function () {
    var hasDesktop = typeof window.desktop !== 'undefined' && window.desktop;
    var nav = hasDesktop && window.desktop.nav ? window.desktop.nav : null;
    var win = hasDesktop && window.desktop.window ? window.desktop.window : null;

    /* ---- Navigation buttons ---- */
    document.querySelectorAll('[data-action]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var a = btn.getAttribute('data-action');
        if (nav && typeof nav[a] === 'function') { nav[a](); }
      });
    });

    /* ---- Window controls (map data-win -> correct method) ---- */
    document.querySelectorAll('[data-win]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var a = btn.getAttribute('data-win');
        var fn = null;
        if (a === 'minimize')      fn = win && win.minimize;
        else if (a === 'maximize') fn = win && win.toggleMaximize;
        else if (a === 'close')    fn = win && win.close;
        if (typeof fn === 'function') { fn.call(win); }
      });
    });

    /* ---- Tabs: sliding indicator + IPC select ---- */
    var tabs = Array.prototype.slice.call(document.querySelectorAll('.tab'));
    var indicator = document.querySelector('.tab-indicator');

    function moveIndicator(tab) {
      if (!tab || !indicator) return;
      indicator.style.width = tab.offsetWidth + 'px';
      indicator.style.transform = 'translateX(' + tab.offsetLeft + 'px)';
    }

    function setActive(tab, viaIpc) {
      tabs.forEach(function (t) { t.classList.remove('is-active'); });
      if (tab) tab.classList.add('is-active');
      moveIndicator(tab);
      if (!viaIpc && tab) {
        var page = tab.getAttribute('data-tab');
        if (nav && typeof nav.select === 'function') { nav.select(page); }
      }
    }

    tabs.forEach(function (t) {
      t.addEventListener('click', function () { setActive(t, false); });
    });

    /* position indicator once layout is ready */
    function initIndicator() {
      var active = document.querySelector('.tab.is-active');
      moveIndicator(active);
      if (indicator) indicator.classList.add('ready');
    }
    requestAnimationFrame(initIndicator);
    window.addEventListener('load', initIndicator);

    /* keep indicator aligned on resize */
    window.addEventListener('resize', function () {
      moveIndicator(document.querySelector('.tab.is-active'));
    });

    /* ---- Subscribe to nav state from main process ---- */
    if (nav && typeof nav.onState === 'function') {
      try {
        nav.onState(function (state) {
          if (!state || !state.page) return;
          var match = tabs.filter(function (t) {
            return t.getAttribute('data-tab') === state.page;
          })[0];
          if (match && !match.classList.contains('is-active')) {
            setActive(match, true);
          }
        });
      } catch (e) { /* noop */ }
    }

    /* ---- Maximize state sync (icon swap) ---- */
    var maxBtn = document.querySelector('[data-win="maximize"]');
    function setMaximized(isMax) {
      if (!maxBtn) return;
      maxBtn.classList.toggle('is-maximized', !!isMax);
      maxBtn.setAttribute('aria-label', isMax ? '还原' : '最大化');
      maxBtn.setAttribute('title', isMax ? '还原' : '最大化');
    }
    if (win && typeof win.onMaximized === 'function') {
      try { win.onMaximized(setMaximized); } catch (e) { /* noop */ }
    }
  })();
  </script>

    <style>
  /* ============================================================
     Local AI Stack — Shell v2 (Enhanced Titlebar)
     Deep-space glassmorphism · sky-blue / indigo · premium polish
     Fully self-contained — no CDN, inline SVG only
     ============================================================ */
  :root {
    /* ---- Layout ---- */
    --bar-h: 46px;

    /* ---- Core surfaces ---- */
    --las-background: #060818;
    --las-deep: #0a0f28;
    --las-foreground: #e8ecf5;

    /* ---- Accents ---- */
    --las-primary: #38bdf8;     /* sky-blue */
    --las-accent-2: #818cf8;    /* indigo  */
    --las-muted-foreground: #7c8aa5;

    /* ---- Lines / surfaces ---- */
    --las-border: rgba(148, 163, 184, 0.14);
    --las-surface: rgba(15, 21, 48, 0.55);

    /* ---- Semantic ---- */
    --las-success: #34d399;
    --las-danger: #f43f5e;

    /* ---- Typography ---- */
    --las-font-sans: "Segoe UI", "Microsoft YaHei UI", system-ui, -apple-system, sans-serif;

    /* ---- Spec-named aliases ---- */
    --accent: #38bdf8;
    --accent-2: #818cf8;
    --text: #e8ecf5;
    --muted: #7c8aa5;
    --border: rgba(148, 163, 184, 0.14);
    --surface: rgba(15, 21, 48, 0.55);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }

  body {
    overflow: hidden;
    font-family: var(--las-font-sans);
    color: var(--las-foreground);
    background:
      radial-gradient(ellipse 70% 55% at 12% -5%, rgba(56,189,248,0.12), transparent 60%),
      radial-gradient(ellipse 60% 50% at 88% 105%, rgba(129,140,248,0.13), transparent 60%),
      linear-gradient(180deg, #060818 0%, #0a0f28 100%);
  }

  /* ---- App shell root ---- */
  .app-shell {
    display: flex;
    flex-direction: column;
    height: 100vh;
    width: 100vw;
    position: relative;
    overflow: hidden;
  }

  /* ============================== TITLEBAR ============================== */
  .titlebar {
    height: var(--bar-h);
    flex: 0 0 var(--bar-h);
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 6px 0 12px;
    position: relative;
    z-index: 50;
    /* Deeper glassmorphism: multi-layer blur + saturate */
    background: linear-gradient(180deg, rgba(15,21,48,0.82) 0%, rgba(10,15,40,0.62) 100%);
    backdrop-filter: blur(24px) saturate(180%);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    border-bottom: 1px solid rgba(56,189,248,0.18);
    /* inner top highlight line + drop shadow */
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.08),
      0 1px 0 rgba(255,255,255,0.04),
      0 8px 26px rgba(0,0,0,0.42);
    -webkit-app-region: drag;
    app-region: drag;
  }

  /* ---- Background depth: radial gradient mesh (behind content) ---- */
  .bg-mesh {
    position: absolute;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background:
      radial-gradient(circle at 15% 0%, rgba(56,189,248,0.07), transparent 42%),
      radial-gradient(circle at 85% 100%, rgba(129,140,248,0.08), transparent 46%),
      radial-gradient(circle at 50% 50%, rgba(20,28,64,0.22), transparent 62%);
  }

  /* ---- Enhanced dual-layer sweep (prismatic) ---- */
  .sweep {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
  }
  .sweep-1 {
    background: linear-gradient(90deg, transparent 0%, rgba(56,189,248,0.10) 50%, transparent 100%);
    background-size: 250% 100%;
    animation: las-sweep-a 9s linear infinite;
  }
  .sweep-2 {
    background: linear-gradient(90deg, transparent 0%, rgba(129,140,248,0.09) 45%, rgba(56,189,248,0.05) 55%, transparent 100%);
    background-size: 220% 100%;
    animation: las-sweep-b 14s linear infinite;
    animation-delay: -4s;
    mix-blend-mode: screen;
  }
  @keyframes las-sweep-a { 0% { background-position: 200% 0; } 100% { background-position: -100% 0; } }
  @keyframes las-sweep-b { 0% { background-position: 180% 0; } 100% { background-position: -80% 0; } }

  /* ---- Bottom glow hairline with animated gradient ---- */
  .titlebar::after {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: -1px;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(56,189,248,0.6) 30%, rgba(129,140,248,0.6) 70%, transparent);
    background-size: 200% 100%;
    animation: las-hairline 6s linear infinite;
    pointer-events: none;
  }
  @keyframes las-hairline { 0% { background-position: 0% 0; } 100% { background-position: 200% 0; } }

  /* ---- Particle dust ---- */
  .particles { position: absolute; inset: 0; pointer-events: none; }
  .particle { position: absolute; border-radius: 50%; pointer-events: none; }
  .p1 { top: 14px; left: 22%; width: 2px; height: 2px; background: rgba(56,189,248,0.5);  animation: las-float 7s  ease-in-out infinite; }
  .p2 { top: 28px; left: 46%; width: 1px; height: 1px; background: rgba(129,140,248,0.6); animation: las-float 9s  ease-in-out infinite -2s; }
  .p3 { top: 10px; left: 64%; width: 2px; height: 2px; background: rgba(56,189,248,0.4);  animation: las-float 11s ease-in-out infinite -5s; }
  .p4 { top: 30px; left: 82%; width: 1px; height: 1px; background: rgba(129,140,248,0.5); animation: las-float 8s  ease-in-out infinite -3s; }
  @keyframes las-float {
    0%, 100% { transform: translateY(0) translateX(0); opacity: 0.2; }
    50%      { transform: translateY(-6px) translateX(3px); opacity: 0.6; }
  }

  /* ============================== BRAND ============================== */
  .brand {
    display: flex;
    align-items: center;
    gap: 9px;
    user-select: none;
    -webkit-app-region: drag;
    app-region: drag;
  }
  .logo-wrap {
    position: relative;
    width: 26px;
    height: 26px;
    flex: 0 0 auto;
    border-radius: 9px;
    animation: las-pulse 6s ease-in-out infinite;
  }
  .brand-mascot {
    width: 26px;
    height: 26px;
    border-radius: 7px;
    display: block;
    position: relative;
    z-index: 2;
    filter: drop-shadow(0 2px 7px rgba(124,131,255,0.45));
    -webkit-user-drag: none;
    user-select: none;
  }
  /* rotating conic-gradient border around the logo (subtle, 8s) */
  .logo-ring {
    position: absolute;
    inset: -2px;
    border-radius: 9px;
    background: conic-gradient(from 0deg,
      rgba(56,189,248,0),
      rgba(56,189,248,0.55),
      rgba(129,140,248,0.55),
      rgba(56,189,248,0));
    animation: las-spin 8s linear infinite;

    opacity: 0.55;
    filter: blur(0.5px);
    pointer-events: none;

  @keyframes las-spin { to { transform: rotate(360deg); } }
  @keyframes las-pulse {

    33%  { box-shadow: 0 0 0 0 rgba(129,140,248,0), 0 2px 12px rgba(129,140,248,0.70), 0 0 18px rgba(129,140,248,0.40); }

    100% { box-shadow: 0 0 0 0 rgba(56,189,248,0), 0 2px 10px rgba(56,189,248,0.65), 0 0 14px rgba(56,189,248,0.35); }

  .brand-name {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.5px;
    color: var(--las-foreground);

  .brand-name .accent {
    background: linear-gradient(90deg, #38bdf8, #818cf8, #38bdf8);

    background-clip: text;
    -webkit-text-fill-color: transparent;

  @keyframes brand-gradient-shift {
    0%   { background-position: 0% center; }
    50%  { background-position: 100% center; }
    100% { background-position: 0% center; }

  /* ============================== TABS (sliding pill) ============================== */
  .tabs {
    position: relative;
    display: flex;
    align-items: center;
    gap: 4px;
    margin-left: 8px;
    padding: 4px;
    border-radius: 999px;
    background: rgba(8,12,30,0.35);
    border: 1px solid rgba(148,163,184,0.08);
    -webkit-app-region: no-drag;
    app-region: no-drag;
  }
  .tab-indicator {
    position: absolute;
    top: 4px;
    left: 0;
    height: calc(100% - 8px);
    border-radius: 999px;
    background: linear-gradient(135deg, rgba(56,189,248,0.28), rgba(129,140,248,0.28));
    border: 1px solid rgba(56,189,248,0.40);
    box-shadow: 0 0 14px rgba(56,189,248,0.30), inset 0 1px 0 rgba(255,255,255,0.10);
    transition: transform .38s cubic-bezier(.4,0,.2,1),
                width .38s cubic-bezier(.4,0,.2,1),
                opacity .3s ease;
    z-index: 0;
    pointer-events: none;
    opacity: 0;
  }
  .tab-indicator.ready { opacity: 1; }
  /* comet-like trailing glow that follows the indicator */
  .tab-indicator::after {
    content: "";
    position: absolute;
    top: 50%;
    right: 100%;
    width: 60px;
    height: 70%;
    transform: translateY(-50%);
    background: linear-gradient(90deg,
      transparent 0%,
      rgba(56,189,248,0.0) 10%,
      rgba(56,189,248,0.18) 55%,
      rgba(129,140,248,0.32) 95%,
      rgba(129,140,248,0.0) 100%);
    filter: blur(3px);
    border-radius: 999px;
    pointer-events: none;
    opacity: 0.8;
    transition: opacity .3s ease;
  }
  /* tiny animated dot under the active tab */
  .tab-dot {
    position: absolute;
    left: 50%;
    bottom: -5px;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: linear-gradient(90deg, #38bdf8, #818cf8);
    box-shadow: 0 0 6px rgba(56,189,248,0.8);
    animation: las-dot-breathe 2.4s ease-in-out infinite;
  }
  @keyframes las-dot-breathe {
    0%, 100% { opacity: 0.6; transform: translateX(-50%) scale(0.8); }
    50%      { opacity: 1;   transform: translateX(-50%) scale(1.15); }
  }
  .tab {
    position: relative;
    z-index: 1;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 13px;
    font-family: inherit;
    font-size: 12px;
    font-weight: 500;
    color: var(--las-muted-foreground);
    border-radius: 999px;
    border: 1px solid transparent;
    background: transparent;
    cursor: pointer;
    white-space: nowrap;
    transform-origin: center bottom;
    transition: color .2s ease, background .2s ease,
                transform .35s cubic-bezier(.34, 1.56, .64, 1),
                box-shadow .35s cubic-bezier(.34, 1.56, .64, 1);
  }
  .tab svg { width: 13px; height: 13px; opacity: .8; transition: opacity .2s ease, transform .35s cubic-bezier(.34, 1.56, .64, 1); }
  .tab:not(.is-active):hover {
    color: var(--las-foreground);
    background: rgba(56,189,248,0.06);
    transform: scale(1.05);
  }
  .tab:not(.is-active):hover svg { opacity: 1; transform: scale(1.08); }
  .tab.is-active {
    color: #eaf6ff;
    transform: scale(1.08);
    box-shadow: 0 4px 14px rgba(56,189,248,0.18);
  }
  .tab.is-active svg { opacity: 1; }

  /* ============================== STATUS BADGE ============================== */
  .status-badge {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 5px 11px;
    font-size: 11px;
    font-weight: 500;
    color: #bfe9d6;
    border-radius: 999px;
    background: rgba(52,211,153,0.08);
    border: 1px solid rgba(52,211,153,0.22);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    white-space: nowrap;
    margin-left: 2px;
    user-select: none;
  }
  .status-led {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--las-success);
    box-shadow: 0 0 6px rgba(52,211,153,0.8);
    animation: las-led 2.6s ease-in-out infinite;
    flex: 0 0 auto;
  }
  @keyframes las-led {
    0%, 100% { opacity: 0.65; transform: scale(0.85); box-shadow: 0 0 5px rgba(52,211,153,0.6); }
    50%      { opacity: 1;    transform: scale(1.1);  box-shadow: 0 0 10px rgba(52,211,153,1); }
  }

  .spacer { flex: 1 1 auto; }

  /* ============================== NAV BUTTONS ============================== */
  .nav-group {
    display: flex;
    align-items: center;
    gap: 2px;
    padding-right: 4px;
    -webkit-app-region: no-drag;
    app-region: no-drag;
  }
  .icon-btn {
    width: 30px;
    height: 30px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: none;
    border-radius: 8px;
    background: transparent;
    color: var(--las-muted-foreground);

    transition: background .18s ease, color .18s ease, box-shadow .18s ease, transform .1s ease;
  }
  .icon-btn svg { width: 15px; height: 15px; }
  .icon-btn:hover {
    background: rgba(56,189,248,0.14);
    color: #eaf6ff;
    box-shadow: 0 0 12px rgba(56,189,248,0.25);
  }
  .icon-btn:active { transform: scale(0.88); }

  /* ============================== WINDOW CONTROLS ============================== */
  .win-group {
    display: flex;
    align-items: center;
    gap: 1px;
    margin-left: 4px;
    -webkit-app-region: no-drag;
    app-region: no-drag;
  }
  .win-btn {
    position: relative;
    overflow: hidden;
    width: 42px;
    height: 34px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: none;
    border-radius: 8px;
    background: transparent;
    color: var(--las-muted-foreground);
    cursor: pointer;
    transition: background .18s ease, color .18s ease, box-shadow .18s ease, transform .18s cubic-bezier(.34, 1.56, .64, 1);
  }
  .win-btn svg { width: 14px; height: 14px; position: relative; z-index: 2; }
  .win-btn:not(.win-close):hover {
    background: radial-gradient(circle at 50% 50%,
      rgba(56,189,248,0.32) 0%,
      rgba(56,189,248,0.12) 45%,
      rgba(255,255,255,0.06) 100%);
    color: #eaf6ff;
    transform: scale(1.08);
    box-shadow: 0 0 14px rgba(56,189,248,0.30), inset 0 0 0 1px rgba(56,189,248,0.18);
  }
  /* ripple effect on click */
  .win-btn::before {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    width: 0;
    height: 0;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(56,189,248,0.45) 0%, rgba(56,189,248,0) 70%);
    transform: translate(-50%, -50%) scale(0);
    pointer-events: none;
    z-index: 1;
    opacity: 0;
  }
  .win-btn:active::before {
    width: 120%;
    height: 120%;
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
    transition: width .4s ease-out, height .4s ease-out, opacity .4s ease-out, transform .4s ease-out;
  }
  .win-btn.win-close:hover {
    background: #e5484d;
    color: #fff;
    box-shadow: 0 0 16px rgba(244,63,94,0.55), inset 0 0 0 1px rgba(255,255,255,0.12);
  }
  .win-btn:active { transform: scale(0.9); }
  /* maximize / restore icon swap */
  .win-btn .ico-restore { display: none; }
  .win-btn.is-maximized .ico-max { display: none; }
  .win-btn.is-maximized .ico-restore { display: inline-flex; }

  /* ============================== VIEW HOST ============================== */
  #view-host {
    flex: 1 1 auto;
    position: relative;
    overflow: hidden;
    background:

  .host-hint-led {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: rgba(56,189,248,0.4);
    box-shadow: 0 0 6px rgba(56,189,248,0.4);

  /* ============================== v3 ENHANCEMENTS ============================== */

  /* ---- Command palette hint ---- */
  .cmd-hint {

  /* ---- Enhanced titlebar depth: extra inner glow ---- */

  /* ============================== NOTIFICATION BELL ============================== */
  .notif-bell {
    position: relative;
    width: 30px;
    height: 30px;
    margin-left: 6px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: 1px solid rgba(148,163,184,0.12);
    border-radius: 9px;
    background: rgba(8,12,30,0.40);

    color: var(--las-muted-foreground);
    cursor: pointer;
    -webkit-app-region: no-drag;
    app-region: no-drag;
    transition: color .18s ease, border-color .18s ease, box-shadow .18s ease, transform .18s cubic-bezier(.34, 1.56, .64, 1);

  /* ---- V5-1: Liquid morphing tab indicator ---- */
  .tab-indicator {
    border-radius: 999px;

    border: 1px solid rgba(56,189,248,0.35);
    box-shadow:

<script>
/* ============================================================
   v6 QUANTUM GLASS — Interactive Enhancements
   Mouse spotlight · Parallax depth · Tab ripple · Glow trail
   ============================================================ */
(function () {
  var titlebar = document.querySelector('.titlebar');
  var tabsEl = document.querySelector('.tabs');

  /* Mouse-tracking spotlight on titlebar */
  if (titlebar) {
    titlebar.addEventListener('mousemove', function (e) {
      var rect = titlebar.getBoundingClientRect();
      var x = ((e.clientX - rect.left) / rect.width * 100).toFixed(1);
      var y = ((e.clientY - rect.top) / rect.height * 100).toFixed(1);
      titlebar.style.setProperty('--mx', x + '%');
      titlebar.style.setProperty('--my', y + '%');
    });
  }

  /* Parallax depth on decorative layers */
  if (titlebar) {
    var layers = titlebar.querySelectorAll('.bg-mesh, .sweep-1, .sweep-2, .particles');
    titlebar.addEventListener('mousemove', function (e) {
      var rect = titlebar.getBoundingClientRect();
      var cx = (e.clientX - rect.left) / rect.width - 0.5;
      var cy = (e.clientY - rect.top) / rect.height - 0.5;
      layers.forEach(function (layer, i) {
        var depth = (i + 1) * 2.5;
        layer.style.transform = 'translate(' + (cx * depth).toFixed(1) + 'px, ' + (cy * depth).toFixed(1) + 'px)';
      });
    });
    titlebar.addEventListener('mouseleave', function () {
      layers.forEach(function (layer) { layer.style.transform = ''; });
    });
  }

  /* Tab click ripple */
  document.querySelectorAll('.tab').forEach(function (tab) {
    tab.addEventListener('click', function (e) {
      var ripple = document.createElement('span');
      ripple.className = 'ripple-v6';
      var rect = tab.getBoundingClientRect();
      var size = Math.max(rect.width, rect.height);
      ripple.style.width = ripple.style.height = size + 'px';
      ripple.style.left = (e.clientX - rect.left - size / 2) + 'px';
      ripple.style.top = (e.clientY - rect.top - size / 2) + 'px';
      tab.appendChild(ripple);
      setTimeout(function () { ripple.remove(); }, 600);
    });
  });

  /* Tab glow trail following mouse */
  if (tabsEl) {
    tabsEl.addEventListener('mousemove', function (e) {
      var rect = tabsEl.getBoundingClientRect();
      var x = e.clientX - rect.left;
      tabsEl.style.setProperty('--tab-mx', (x - 40) + 'px');
    });
  }
})();
</script>
