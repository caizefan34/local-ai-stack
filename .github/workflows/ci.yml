name: CI

on:
  push:
    branches: [master, main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '**.svg'
      - '**.png'
  pull_request:
    branches: [master, main]

jobs:
  lint:
    name: Lint & Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          pip install pylint flake8 -q

      - name: Validate JSON configs
        run: |
          for f in config/*.json; do
            echo "Validating $f..."
            python -c "import json; json.load(open('$f'))" || exit 1
          done
          echo "All JSON configs valid."

      - name: Pylint — Python code style
        run: |
          EXIT=0
          while IFS= read -r -d '' file; do
            echo "Linting $file..."
            pylint --exit-zero --disable=C0103,C0114,C0115,C0116,W0718,R0801,R0913,R0914,R0902,R0912 \
              --max-line-length=120 --max-args=10 "$file" 2>&1 | tail -3
          done < <(find . -name '*.py' -not -path './.git/*' -not -path '*/__pycache__/*' -print0)
          echo "Pylint checks complete (non-blocking)."

      - name: Flake8 — Python syntax & style
        run: |
          find . -name '*.py' -not -path './.git/*' -not -path '*/__pycache__/*' -exec flake8 {} \; \
            --max-line-length=120 --ignore=E501,W503,E402,F401 2>&1 | head -30
          echo "Flake8 checks complete (non-blocking)."

      - name: ESLint — JavaScript style check
        run: |
          JS_FILES=$(find . -name '*.js' -not -path './node_modules/*' -not -path './.git/*' 2>/dev/null | head -20)
          TS_FILES=$(find . -name '*.ts' -not -path './node_modules/*' -not -path './.git/*' 2>/dev/null | head -20)
          if [ -z "$JS_FILES" ] && [ -z "$TS_FILES" ]; then
            echo "No JavaScript/TypeScript files found — ESLint skipped."
          elif command -v npx &>/dev/null; then
            npx --yes eslint --version 2>/dev/null && \
              npx eslint $JS_FILES $TS_FILES 2>&1 | head -20 || \
              echo "ESLint check completed (non-blocking)."
          else
            echo "Node.js not available — ESLint skipped."
          fi

      - name: Check Docker Compose syntax
        run: |
          docker compose --env-file .env.example -f docker/docker-compose.yml config --quiet 2>&1 && \
            echo "Docker Compose config valid." || {
            echo "::warning::Set .env vars via: cp .env.example .env"
            exit 1
          }

      - name: Validate shell scripts
        run: |
          for f in scripts/*.sh; do
            if [ -f "$f" ]; then
              echo "Checking $f..."
              bash -n "$f" || exit 1
            fi
          done
          echo "All shell scripts valid."

  test:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f reranker/requirements.txt ]; then
            pip install -r reranker/requirements.txt -q
          fi

      - name: Python syntax sanity check
        run: |
          python -m compileall -q reranker knowledge-base/sync tests
          echo "All Python files compile correctly."

      - name: Run unit tests
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          if [ -f reranker/test.py ]; then
            echo "Found reranker/test.py — checking syntax only (requires a running reranker service)."
            python -m py_compile reranker/test.py
          else
            echo "No unit tests found in reranker/."
          fi
          if [ -f tests/evaluate.py ]; then
            echo "Found evaluate.py — checking syntax only (requires running Ollama)."
            python -c "import ast; ast.parse(open('tests/evaluate.py').read())"
          fi
          if [ -f tests/e2e_test.py ]; then
            echo "Found e2e_test.py — checking syntax only (requires running services)."
            python -c "import ast; ast.parse(open('tests/e2e_test.py').read())"
          fi

  docker:
    name: Docker Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Docker Compose configuration
        run: |
          docker compose --env-file .env.example -f docker/docker-compose.yml config --quiet 2>&1 && \
            echo "Docker Compose configuration is valid." || {
            echo "::warning::Docker Compose config check failed."
            exit 1
          }

      - name: Check for Dockerfiles
        run: |
          dockerfiles=$(find . -name 'Dockerfile*' -not -path './.git/*')
          if [ -n "$dockerfiles" ]; then
            echo "Dockerfiles found, building..."
            for df in $dockerfiles; do
              echo "Found: $df"
            done
          else
            echo "No custom Dockerfiles (using pre-built images via docker-compose.yml)."
          fi
