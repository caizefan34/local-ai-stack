name: Deploy GitHub Pages
on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - 'README.md'
      - '.github/workflows/deploy.yml'

jobs:
  deploy:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON configs
        run: |
          for f in config/*.json; do
            python -c "import json; json.load(open('$f'))"
          done
      - name: Check Python syntax
        run: |
          find . -name '*.py' -not -path './git/*' -exec python -m py_compile {} \;
      - name: Validate Pages links
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class Links(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.links = []

              def handle_starttag(self, tag, attrs):
                  if tag == "a":
                      href = dict(attrs).get("href")
                      if href:
                          self.links.append(href)

          page = Path("docs/index.html")
          parser = Links()
          parser.feed(page.read_text(encoding="utf-8"))
          for href in parser.links:
              if href.startswith(("http://", "https://", "#", "mailto:")):
                  continue
              if not (page.parent / href).exists():
                  raise SystemExit(f"Broken local Pages link: {href}")
          PY
