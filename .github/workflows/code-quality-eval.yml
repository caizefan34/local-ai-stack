name: Local Code Quality Evaluation

on:
  workflow_dispatch:
    inputs:
      model:
        description: Ollama model to evaluate
        required: true
        default: qwen2.5-coder:7b
      baseline:
        description: Optional path to a prior result JSON on the runner
        required: false
        default: ''

jobs:
  evaluate:
    # A GitHub-hosted runner cannot access a private local Ollama instance.
    runs-on: [self-hosted, ollama]
    steps:
      - uses: actions/checkout@v4
      - name: Verify model availability
        shell: powershell
        env:
          MODEL: ${{ inputs.model }}
        run: ollama show $env:MODEL
      - name: Run local code benchmark
        shell: powershell
        env:
          MODEL: ${{ inputs.model }}
          BASELINE: ${{ inputs.baseline }}
        run: |
          $arguments = @('code_intelligence/evaluate_codegen.py', 'benchmarks/codegen-smoke.json', '--model', $env:MODEL)
          if ($env:BASELINE) { $arguments += @('--baseline', $env:BASELINE) }
          $arguments += @('--output', 'codegen-eval.json')
          & python @arguments
      - uses: actions/upload-artifact@v4
        with:
          name: codegen-eval
          path: codegen-eval.json
