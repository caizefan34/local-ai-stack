# NOTE: Resource limits have been moved to docker-compose.yml (mem_limit)
# This file is kept for swarm deployments
services:
  pg:
    deploy:
      resources:
        limits: { memory: 512M }
        reservations: { memory: 256M }

  mongo:
    deploy:
      resources:
        limits: { memory: 1G }
        reservations: { memory: 512M }

  redis:
    deploy:
      resources:
        limits: { memory: 256M }
        reservations: { memory: 128M }

  fastgpt:
    deploy:
      resources:
        limits: { memory: 2G }
        reservations: { memory: 1G }
