services:
  pg:
    image: registry.cn-hangzhou.aliyuncs.com/fastgpt/pgvector:v0.7.0
    container_name: fastgpt-pg
    restart: always
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - fastgpt-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - fastgpt-net

  mongo:
    image: registry.cn-hangzhou.aliyuncs.com/fastgpt/mongo:5.0.18
    container_name: fastgpt-mongo
    restart: always
    command: ["mongod", "--replSet", "rs0"]
    ports:
      - 27017:27017
    volumes:
      - fastgpt-mongo:/data/db
    healthcheck:
      test: echo "try { rs.status() } catch (err) { rs.initiate({_id:'rs0',members:[{_id:0,host:'fastgpt-mongo:27017'}]}) }" | mongo --quiet
      interval: 5s
      timeout: 30s
      retries: 30
    networks:
      - fastgpt-net

  redis:
    image: docker.m.daocloud.io/library/redis:7.0.11-alpine
    container_name: fastgpt-redis
    restart: always
    ports:
      - 6379:6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - fastgpt-net

  fastgpt:
    image: registry.cn-hangzhou.aliyuncs.com/fastgpt/fastgpt:v4.8.9
    container_name: fastgpt
    restart: always
    ports:
      - 3000:3000
    depends_on:
      pg:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DEFAULT_ROOT_PSW: ${ADMIN_PASSWORD:-1234}      # CHANGE THIS IN PRODUCTION
      MONGODB_URI: mongodb://fastgpt-mongo:27017/fastgpt
      PG_HOST: fastgpt-pg
      PG_PORT: 5432
      PG_USER: postgres
      PG_PASSWORD: postgres
      PG_DB_NAME: postgres
      REDIS_URL: redis://fastgpt-redis:6379
      PG_URL: postgresql://postgres:postgres@fastgpt-pg:5432/postgres
      TOKEN_KEY: ${TOKEN_KEY:-change-this-to-your-own-secret-key}
    volumes:
      - ./config.json:/app/data/config.json:ro
    networks:
      - fastgpt-net
    extra_hosts:
      - host.docker.internal:host-gateway

networks:
  fastgpt-net:
    driver: bridge

volumes:
  fastgpt-pg:
  fastgpt-mongo:
