services:
  pg:
    image: ${PG_IMAGE:-registry.cn-hangzhou.aliyuncs.com/fastgpt/pgvector:v0.7.0}
    container_name: ${PG_CONTAINER_NAME:-fastgpt-pg}
    restart: always
    ports:
      - "${DATABASE_BIND_ADDRESS:-127.0.0.1}:${PG_HOST_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${PG_USER:-postgres}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-postgres}
      POSTGRES_DB: ${PG_DB_NAME:-postgres}
    volumes:
      - fastgpt-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-postgres} -d ${PG_DB_NAME:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: ${PG_MEM_LIMIT:-512m}
          cpus: ${PG_CPU_LIMIT:-0.5}
    networks:
      - fastgpt-net

  mongo:
    image: ${MONGO_IMAGE:-registry.cn-hangzhou.aliyuncs.com/fastgpt/mongo:5.0.18}
    container_name: ${MONGO_CONTAINER_NAME:-fastgpt-mongo}
    restart: always
    command: ["mongod", "--replSet", "rs0"]
    ports:
      - "${DATABASE_BIND_ADDRESS:-127.0.0.1}:${MONGO_HOST_PORT:-27017}:27017"
    volumes:
      - fastgpt-mongo:/data/db
    healthcheck:
      test: ["CMD-SHELL", "echo 'try { rs.status() } catch (err) { rs.initiate({_id:\"rs0\",members:[{_id:0,host:\"mongo:27017\"}]}) }' | mongosh --quiet"]
      interval: 5s
      timeout: 30s
      retries: 30
    deploy:
      resources:
        limits:
          memory: ${MONGO_MEM_LIMIT:-1g}
          cpus: ${MONGO_CPU_LIMIT:-1}
    networks:
      - fastgpt-net

  redis:
    image: ${REDIS_IMAGE:-docker.m.daocloud.io/library/redis:7.0.11-alpine}
    container_name: ${REDIS_CONTAINER_NAME:-fastgpt-redis}
    restart: always
    ports:
      - "${DATABASE_BIND_ADDRESS:-127.0.0.1}:${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: ${REDIS_MEM_LIMIT:-256m}
          cpus: ${REDIS_CPU_LIMIT:-0.3}
    networks:
      - fastgpt-net

  fastgpt:
    image: ${FASTGPT_IMAGE:-registry.cn-hangzhou.aliyuncs.com/fastgpt/fastgpt:v4.8.9}
    container_name: fastgpt
    restart: always
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${FASTGPT_PORT:-3000}:3000"
    depends_on:
      pg:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DEFAULT_ROOT_PSW: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env before starting}
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/fastgpt}
      # FastGPT v4.8.9 reads PG_URL; only PG_HOST/PG_PORT causes connection failure
      PG_URL: postgresql://${PG_USER:-postgres}:${PG_PASSWORD:-postgres}@${PG_HOST:-pg}:${PG_PORT:-5432}/${PG_DB_NAME:-postgres}
      PG_HOST: ${PG_HOST:-pg}
      PG_PORT: ${PG_PORT:-5432}
      PG_USER: ${PG_USER:-postgres}
      PG_PASSWORD: ${PG_PASSWORD:-postgres}
      PG_DB_NAME: ${PG_DB_NAME:-postgres}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      TOKEN_KEY: ${TOKEN_KEY:?Set TOKEN_KEY in .env before starting}
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    volumes:
      - ${FASTGPT_CONFIG:-../config/fastgpt-config.json}:/app/data/config.json:ro
    deploy:
      resources:
        limits:
          memory: ${FASTGPT_MEM_LIMIT:-2g}
          cpus: ${FASTGPT_CPU_LIMIT:-1}
    networks:
      - fastgpt-net
    extra_hosts:
      - host.docker.internal:host-gateway

networks:
  fastgpt-net:
    driver: bridge

volumes:
  fastgpt-pg:
  fastgpt-mongo:
