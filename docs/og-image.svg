<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0b1121"/>
      <stop offset="50%" style="stop-color:#131c31"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:0.05"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bg)"/>
  
  <!-- Glow effects -->
  <circle cx="200" cy="320" r="300" fill="url(#glow)"/>
  <circle cx="1080" cy="320" r="250" fill="url(#glow)"/>
  
  <!-- Grid lines -->
  <line x1="0" y1="0" x2="1280" y2="640" stroke="#1e293b" stroke-width="0.5" opacity="0.3"/>
  <line x1="640" y1="0" x2="1280" y2="320" stroke="#1e293b" stroke-width="0.5" opacity="0.3"/>
  <line x1="0" y1="320" x2="640" y2="640" stroke="#1e293b" stroke-width="0.5" opacity="0.3"/>
  
  <!-- Main Title -->
  <text x="640" y="220" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-weight="800" font-size="64" fill="url(#accent)">Local AI Stack</text>
  
  <!-- Subtitle -->
  <text x="640" y="285" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-weight="500" font-size="26" fill="#94a3b8">Ollama + FastGPT + RAG — Enterprise-grade AI, 100% local</text>
  
  <!-- Feature pills -->
  <rect x="340" y="330" width="160" height="40" rx="20" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="420" y="356" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="15" fill="#a5b4fc" font-weight="600">100% Free</text>
  
  <rect x="520" y="330" width="160" height="40" rx="20" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="600" y="356" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="15" fill="#a5b4fc" font-weight="600">No GPU</text>
  
  <rect x="700" y="330" width="180" height="40" rx="20" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="790" y="356" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="15" fill="#a5b4fc" font-weight="600">Privacy First</text>
  
  <rect x="900" y="330" width="160" height="40" rx="20" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="980" y="356" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="15" fill="#a5b4fc" font-weight="600">RAG + LoRA</text>
  
  <!-- Bottom features -->
  <text x="640" y="430" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="18" fill="#64748b">RAG + Reranker • Visual Knowledge Base • LoRA Fine-Tuning</text>
  <text x="640" y="460" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="18" fill="#64748b">KB Auto-Sync • Desktop Dashboard • Multi-Model</text>
  
  <!-- Status bar -->
  <rect x="390" y="505" width="500" height="44" rx="22" fill="#131c31" stroke="#334155" stroke-width="1"/>
  <circle cx="430" cy="527" r="6" fill="#22c55e"/>
  <text x="450" y="533" font-family="monospace" font-size="14" fill="#22c55e">ollama</text>
  <circle cx="540" cy="527" r="6" fill="#22c55e"/>
  <text x="560" y="533" font-family="monospace" font-size="14" fill="#22c55e">fastgpt</text>
  <circle cx="660" cy="527" r="6" fill="#22c55e"/>
  <text x="680" y="533" font-family="monospace" font-size="14" fill="#22c55e">reranker</text>
  <circle cx="780" cy="527" r="6" fill="#22c55e"/>
  <text x="800" y="533" font-family="monospace" font-size="14" fill="#22c55e">docker</text>

  <!-- GitHub corner -->
  <text x="1200" y="600" text-anchor="end" font-family="monospace" font-size="14" fill="#4f46e5">github.com/caizefan34/local-ai-stack</text>
</svg>
